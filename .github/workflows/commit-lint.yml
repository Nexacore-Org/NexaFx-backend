name: Commit Lint

on:
  pull_request:
    branches: [v2, main]

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > pr-title.txt
          npx commitlint --edit pr-title.txt

      - name: Lint commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          npx commitlint --from="origin/${BASE_REF}" --to=HEAD
