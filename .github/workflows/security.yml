name: Security Checks

# NOTE: The TruffleHog secret-scanning job below is the single, consolidated
# secret-scanning workflow for this repository (issue #1034). It replaces the
# former `.github/workflows/secrets-scan.yml`, which was removed to avoid two
# divergent TruffleHog configurations. This workflow is configured as a
# REQUIRED status check on the `v2` branch (the active development and default
# branch). Configure it under Settings > Branches > Branch protection rules for
# `v2` and require the "TruffleHog Secrets Scan" check.

on:
  pull_request:
    branches:
      - v2
      - main
  push:
    branches:
      - v2
      - main
  schedule:
    # Weekly full-history scan (Mondays 03:00 UTC).
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@main
        with:
          # Stricter verbosity: report verified AND unknown findings.
          # Do NOT downgrade to --only-verified (misses higher-confidence
          # but unverified findings).
          extra_args: --results=verified,unknown --exclude-paths=.trufflehog-ignore

  npm-audit:
    name: npm Audit (prod deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL SAST
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
