version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexafx_postgres_v2
    environment:
      POSTGRES_DB: nexafx
      POSTGRES_USER: nexafx
      POSTGRES_PASSWORD: nexafx
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexafx']
      interval: 5s
      timeout: 5s
      retries: 5

  # Jaeger distributed tracing system instance container
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: nexafx-jaeger-v2
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Access the Jaeger UI Dashboard at http://localhost:16686
      - "4318:4318"    # OTLP HTTP receiver endpoint targeted by OpenTelemetry
    restart: unless-stopped

volumes:
  postgres_data_v2:
